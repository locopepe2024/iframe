<!doctype html>
<html lang="zh-CN" class="atelier-dark">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>陪伴版 · 交互线框 V2</title>
<style>
:root{color-scheme:dark;--base:#0c0b0e;--panel:#131116;--raised:#181620;--text:#f2ede4;--secondary:#c4bdce;--line:#57515f;--primary:#34d8c4;--on-primary:#0c0b0e;font:20px/1.6 system-ui,sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--text)}button,input,textarea,select{font:inherit;color:inherit}button,a{touch-action:manipulation}button{min-height:48px;border:1px solid var(--line);background:var(--raised);border-radius:12px;padding:.45rem .7rem;cursor:pointer}button:disabled{opacity:.5;cursor:default}button:hover:not(:disabled){border-color:var(--primary)}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--primary);outline-offset:3px}button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}button svg{width:24px;height:24px;flex-shrink:0;vertical-align:middle}button[aria-pressed=true]{border-color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}h1,h2,h3,p{margin:0 0 .6rem}h1{font-size:1.3rem}h2{font-size:1.15rem}h3{font-size:1.05rem}a{color:var(--primary)}.small{font-size:.85rem;color:var(--secondary)}.reviewbar{max-width:64rem;margin:0 auto;padding:.6rem .8rem;border-bottom:1px solid var(--line)}.reviewbar p{margin-bottom:.4rem}.reviewnav{display:flex;gap:.4rem;flex-wrap:wrap}.reviewnav button{font-size:.8rem}.phone{max-width:42rem;margin:auto;height:calc(100dvh - 160px);min-height:520px;display:flex;flex-direction:column;padding:0 .8rem}.header{display:flex;justify-content:space-between;align-items:center;gap:.5rem;padding:.6rem 0;border-bottom:1px solid var(--line);flex-shrink:0}.header h1{margin:0}.stream{flex:1;min-height:5rem;overflow-y:auto;padding:1rem 0;overscroll-behavior:contain}.plans{margin-bottom:1rem}.rail{display:flex;gap:.7rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;padding:.25rem .15rem .7rem}.plan{flex:0 0 87%;scroll-snap-align:start;border:1px solid var(--line);border-radius:20px;background:var(--panel);padding:1rem;min-width:0}.plan p{overflow-wrap:anywhere}.tag{display:inline-block;padding:.1rem .45rem;margin-bottom:.65rem;font-size:.8rem;border:1px solid var(--line);border-radius:6px;color:var(--secondary)}.plan .summary{min-height:3.2rem}.paging{display:flex;justify-content:center;align-items:center;gap:.8rem}.paging span{font-size:.9rem}.collapsed{display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:.5rem;margin-bottom:1rem}.message{max-width:94%;border:1px solid var(--line);background:var(--panel);padding:.8rem;border-radius:16px 16px 16px 4px;margin:.8rem 0;white-space:pre-wrap;overflow-wrap:anywhere}.message.me{margin-left:auto;background:#14352f;border-radius:16px 16px 4px 16px}.quick{display:flex;flex-wrap:wrap;gap:.6rem;margin:1rem 0}.panel{padding:1rem;border:1px solid var(--line);border-radius:16px;background:var(--panel);margin:1rem 0}.actions{display:flex;gap:.5rem;flex-wrap:wrap}.composer{flex-shrink:0;padding:.6rem 0 max(.6rem,env(safe-area-inset-bottom));max-height:52dvh;overflow:auto;background:var(--base)}.inputpanel{border:1px solid var(--line);border-radius:20px;padding:.65rem;background:var(--panel)}label{display:block;font-size:.9rem}input,textarea{display:block;width:100%;border:1px solid var(--line);border-radius:10px;padding:.5rem;background:var(--base)}textarea{resize:vertical;min-height:3.8rem;max-height:18dvh;margin:.3rem 0 .6rem}.toolbar{display:flex;align-items:center;gap:.45rem;flex-wrap:wrap}.toolbar button{display:inline-flex;align-items:center;justify-content:center;gap:.25rem}.toolbar .send{margin-left:auto;width:52px;height:52px;border-radius:50%}.voice{margin-left:auto}.toolbar .voice+button{margin-left:0}.menu{display:flex;gap:.5rem;flex-wrap:wrap;padding:.6rem 0}.attachments{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.5rem}.attachment{display:flex;align-items:center;gap:.5rem;padding:.4rem;border:1px solid var(--line);border-radius:12px}.thumb{display:block;width:100%;aspect-ratio:4/3;border:1px solid var(--line);border-radius:12px;object-fit:cover;background:#24222b}.mini{width:52px;height:52px;object-fit:cover}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}.grid button{text-align:left;min-width:0}.grid button span{display:block;margin-top:.4rem}.search{display:flex;gap:.5rem;align-items:end;margin:1rem 0}.search label{flex:1;min-width:0}.notice{font-size:.85rem;color:var(--secondary);margin:.3rem 0 0}dl{margin:.7rem 0}dt{color:var(--secondary);font-size:.85rem}dd{margin:0 0 .6rem;overflow-wrap:anywhere}.hidden,[hidden]{display:none!important}.statehead{display:flex;justify-content:space-between;gap:.5rem;align-items:center;margin-bottom:.5rem}
@media(max-width:380px){.phone{padding:0 .55rem}.toolbar button{padding:.4rem}.toolbar .voice{flex-direction:column;font-size:.8rem;gap:0}.reviewnav button{flex:1}.phone{height:calc(100dvh - 220px)}.search{flex-wrap:wrap}.search label{flex-basis:100%}}
@media(max-height:550px){.phone{height:auto;min-height:100dvh}.stream{overflow:visible}.composer{max-height:none}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<svg aria-hidden="true" style="display:none"><defs>
<symbol id="plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol><symbol id="search" viewBox="0 0 24 24"><circle cx="10" cy="10" r="6"/><path d="m15 15 6 6"/></symbol><symbol id="mic" viewBox="0 0 24 24"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2M12 19v3M8 22h8"/></symbol><symbol id="arrow" viewBox="0 0 24 24"><path d="M12 20V4m-7 7 7-7 7 7"/></symbol>
<symbol id="stop" viewBox="0 0 24 24"><rect x="5" y="5" width="14" height="14"/></symbol></defs></svg>
<div class="reviewbar"><p><strong>交互线框 V2</strong> <span class="small">示例计划与素材；无上传、提醒或模型调用</span></p><nav class="reviewnav" aria-label="线框状态"><button data-view="home">① 首页</button><button data-view="chat">② 计划对话</button><button data-view="album">③ 相册选择</button><button data-view="review">④ 创作确认</button><button id="reset">重置预览</button></nav></div>
<main class="phone">
<header class="header"><h1>聊天</h1><button id="manage" aria-expanded="false">更多</button></header>
<div id="management" class="panel" hidden><p>会话历史、相册管理和设置从这里进入。</p><p class="small">此线框仅演示入口位置。</p></div>
<div class="stream" id="stream" role="region" aria-label="聊天内容">
<section class="plans" id="plans" aria-label="今日计划示例">
<h2>欢迎回来</h2><p id="greeting">今天按照计划，我们有这些事。</p><p class="small">以下均为示例，尚未读取您的真实计划。</p>
<div class="rail" id="rail" tabindex="0" aria-label="滑动查看计划，方向键或下方按钮切换"></div>
<div class="paging"><button id="previous" aria-label="上一张计划">←</button><span id="position" aria-live="polite">第 1 / 3 张</span><button id="next" aria-label="下一张计划">→</button></div>
</section>
<div id="current" class="collapsed" hidden><span id="currentLabel"></span><button id="returnPlans">返回今日计划</button></div>
<div id="messages"><article class="message">您好，我在。想先处理今天的安排，还是随便聊聊？</article></div>
<div class="quick" id="quick"><button data-quick="聊聊今天">聊聊今天</button><button id="quickAlbum">看看相册</button><button data-quick="写下今天的回忆">写下回忆</button></div>
<section id="album" class="panel" aria-label="相册选择" hidden>
<div class="statehead"><h2>从相册选择</h2><button id="closeAlbum">返回聊天</button></div><p class="small">示例资产库 · 选中后先放入附件区</p>
<div class="actions"><button id="photoTab" aria-pressed="true">照片</button><button id="videoTab" aria-pressed="false">视频</button></div>
<form id="searchForm" class="search"><label>搜索相册<input id="query" placeholder="输入日期、人物或故事关键词"></label><button type="submit">搜索</button></form>
<div class="grid" id="assets"></div><p id="empty" hidden>没有匹配的示例素材，换个词试试。</p>
</section>
<section id="generation" class="panel" aria-label="创作引导" hidden></section>
</div>
<footer class="composer"><div id="attachments" class="attachments" aria-label="待发送附件"></div><div class="inputpanel">
<label for="draft" id="draftLabel">和我聊聊天</label><textarea id="draft" rows="2" placeholder="想说什么，都可以告诉我…"></textarea>
<div id="modeMenu" class="menu" role="group" aria-label="选择创作类型" hidden><button data-mode="chat">聊天</button><button data-mode="image">图片</button><button data-mode="video">视频</button></div>
<div class="toolbar"><button id="mode" aria-expanded="false">聊天⌄</button><button id="upload"><svg fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="#plus"/></svg>上传</button><button id="openAlbum"><svg fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="#search"/></svg>相册</button><button id="voice" class="voice"><svg fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="#mic"/></svg><span>对话中</span></button><button id="send" class="primary send" aria-label="发送"><svg fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><use href="#arrow"/></svg></button></div>
</div><p id="notice" role="status" class="notice">点选计划卡片开始，或直接输入。</p></footer>
</main>
<script>
'use strict';
const $=id=>document.getElementById(id);
const plans=[{title:'今天的安排',summary:'今天有 3 件事，下一件是下午 3 点散步。',tag:'示例待办 · 下午 3 点',action:'看看安排',question:'下午 3 点的散步，今天还想按这个时间出发吗？'}, {title:'一起整理照片',summary:'昨天的照片中，还有 2 张想请您讲讲。',tag:'示例待处理 · 2 张照片',action:'一起看看',question:'先选一张想讲的照片吧。您可以说说照片里发生了什么。'}, {title:'记录今天的生活',summary:'聊聊今天发生的事，整理成一篇日记草稿。',tag:'助手建议 · 可以跳过',action:'聊聊今天',question:'今天有什么让您印象深刻的事情？'}];
const assets=[{id:'garden',title:'公园散步',keywords:'公园 散步 花园 今天',kind:'photo',color:'#456552'}, {id:'family',title:'女儿来看我',keywords:'女儿 家人 昨天 团聚',kind:'photo',color:'#815b48'}, {id:'street',title:'老街回忆',keywords:'老街 回忆 旅行',kind:'photo',color:'#4d6275'}, {id:'clip',title:'花园里的小视频',keywords:'花园 视频 散步',kind:'video',color:'#59634a'}];
const drafts={chat:'',image:'',video:''};let mode='chat',chosen=[],kind='photo',index=0,current=null,recording=false,generation=null;
function cover(asset){const svg=`<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300"><rect width="400" height="300" fill="${asset.color}"/><circle cx="290" cy="70" r="32" fill="#d9c598"/><path d="M0 240 100 130 190 220 290 140 400 240V300H0Z" fill="#203a30"/><text x="200" y="280" text-anchor="middle" font-size="24" fill="#fff">示例${asset.kind==='video'?'视频封面':'照片'}</text></svg>`;return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);}
function image(asset,mini=false){const n=document.createElement('img');n.src=cover(asset);n.alt=asset.title+'（示例）';n.className=mini?'thumb mini':'thumb';return n;}
function button(text,fn){const b=document.createElement('button');b.type='button';b.textContent=text;b.onclick=fn;return b;}
function say(text,mine=false){const a=document.createElement('article');a.className='message'+(mine?' me':'');a.textContent=text;$('messages').append(a);}
function status(text){$('notice').textContent=text;}
function bottom(){requestAnimationFrame(()=>{$('stream').scrollTop=$('stream').scrollHeight;});}
function mountPlans(){plans.forEach((plan,i)=>{const a=document.createElement('article');a.className='plan';a.setAttribute('aria-label',`${i+1} / 3 ${plan.title}`);const tag=document.createElement('span');tag.className='tag';tag.textContent=plan.tag;a.append(tag);const h=document.createElement('h3');h.textContent=plan.title;a.append(h);const p=document.createElement('p');p.className='summary';p.textContent=plan.summary;a.append(p,button(plan.action,()=>openPlan(i)));$('rail').append(a);});}
function page(i){index=Math.max(0,Math.min(2,i));$('rail').scrollTo({left:$('rail').children[index].offsetLeft-$('rail').children[0].offsetLeft,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});updatePosition();}
function updatePosition(){$('position').textContent=`第 ${index+1} / 3 张`;$('previous').disabled=index===0;$('next').disabled=index===2;}
function openPlan(i){current=i;$('plans').hidden=true;$('quick').hidden=true;$('current').hidden=false;$('currentLabel').textContent='正在处理：'+plans[i].title;say(plans[i].question);if(i===0){const a=document.createElement('div');a.className='actions';a.append(button('按原计划',()=>scheduleChoice('保留下午 3 点散步的示例计划。')),button('稍后提醒',()=>scheduleChoice('示例：稍后提醒。真实提醒尚未设置。')),button('今天跳过',()=>scheduleChoice('示例：今天跳过散步。真实计划未修改。')));$('messages').append(a);}if(i===1)openAlbum();bottom();}
function scheduleChoice(text){say(text);status('仅演示计划处理反馈，未写入日历或创建提醒。');bottom();}
function renderAssets(){const query=$('query').value.trim();$('assets').replaceChildren();const filtered=assets.filter(a=>a.kind===kind&&(!query||(a.title+' '+a.keywords).includes(query)));$('empty').hidden=filtered.length>0;filtered.forEach(a=>{const b=button('',()=>choose(a));b.append(image(a));const s=document.createElement('span');s.textContent=a.title;b.append(s);$('assets').append(b);});}
function openAlbum(){$('album').hidden=false;renderAssets();bottom();}
function choose(asset){if(!chosen.some(a=>a.id===asset.id))chosen.push(asset);$('album').hidden=true;renderAttachments();status('已放入待发送附件，可移除，尚未发送。');if(generation?.step==='reference')renderGeneration();$('draft').focus();}
function renderAttachments(){$('attachments').replaceChildren();chosen.forEach(a=>{const wrap=document.createElement('div');wrap.className='attachment';const label=document.createElement('span');label.textContent=a.title;wrap.append(image(a,true),label,button('移除',()=>{chosen=chosen.filter(x=>x.id!==a.id);renderAttachments();if(generation?.step==='reference')renderGeneration();}));$('attachments').append(wrap);});}
function switchMode(next){drafts[mode]=$('draft').value;mode=next;$('draft').value=drafts[mode];$('mode').textContent=({chat:'聊天',image:'图片',video:'视频'}[mode])+'⌄';$('draftLabel').textContent=mode==='chat'?'和我聊聊天':mode==='image'?'想生成的图片':'想生成的视频';$('modeMenu').hidden=true;$('mode').setAttribute('aria-expanded','false');status('已切换到'+({chat:'聊天',image:'图片',video:'视频'}[mode])+'，原草稿保留。');}
function renderGeneration(){const host=$('generation');host.hidden=false;host.replaceChildren();const h=document.createElement('h2');const p=document.createElement('p');if(generation.step==='reference'){h.textContent='需要参考一张照片吗？';p.textContent=chosen.length?'已有待发送素材，确认后用于这次创作。':'选择参考照片，或直接用文字创作。';host.append(h,p,button('从相册选择',openAlbum),button('继续',()=>{generation.reference=chosen.filter(a=>a.kind==='photo');generation.step='parameter';renderGeneration();}));}else if(generation.step==='parameter'){h.textContent=generation.mode==='video'?'想要多长的视频？':'选择图片形状';host.append(h);const settings=generation.mode==='video'?['5 秒','10 秒']:['方形','横向','竖向'];settings.forEach(s=>host.append(button(s,()=>{generation.setting=s;generation.step='review';renderGeneration();})));host.append(button('用推荐设置',()=>{generation.setting=settings[0];generation.step='review';renderGeneration();}),button('返回修改',()=>{generation.step='reference';renderGeneration();}));}else{h.textContent=generation.step==='confirmed'?'设置已确认':'看看完整设置';host.append(h);const dl=document.createElement('dl');[['创作类型',generation.mode==='video'?'视频':'图片'],['描述',generation.prompt],['参数',generation.setting],['参考素材',(generation.reference||[]).map(a=>a.title).join('、')||'无'],['费用','尚未报价']].forEach(([k,v])=>{const dt=document.createElement('dt'),dd=document.createElement('dd');dt.textContent=k;dd.textContent=v;dl.append(dt,dd);});host.append(dl);p.textContent='此处仅为交互预览，尚未生成任何作品。';host.append(p);const details=document.createElement('details'),summary=document.createElement('summary'),note=document.createElement('p');summary.textContent='更多设置';note.textContent='模型、分辨率等专业参数放在这里，接入服务后提供。';details.append(summary,note);host.append(details);if(generation.step==='review')host.append(button('确认设置',()=>{generation.step='confirmed';renderGeneration();status('示例设置已确认，未产生费用。');}));host.append(button('返回修改',()=>{generation.step='parameter';renderGeneration();}));}host.append(button('取消创作',()=>{generation=null;host.hidden=true;status('创作草稿和附件仍保留。');}));bottom();}
function send(){const text=$('draft').value.trim();if(!text&&!chosen.length){status('先说几句话，或选一张照片。');return;}if(mode!=='chat'){if(!text){status('请先描述想创作什么。');return;}generation={mode,prompt:text,step:'reference',reference:[],setting:''};renderGeneration();return;}if(text)say(text,true);chosen.forEach(a=>{const card=document.createElement('article');card.className='message me';card.append(image(a));const title=document.createElement('p');title.textContent=a.title;card.append(title);$('messages').append(card);});chosen=[];renderAttachments();drafts[mode]='';$('draft').value='';$('plans').hidden=true;$('quick').hidden=true;$('current').hidden=false;$('currentLabel').textContent=current===null?'自由聊天':'正在处理：'+plans[current].title;say('（示例回复）我在听，您愿意再多讲一点吗？');status('示例消息已进入聊天流，没有发送到模型。');bottom();}
$('previous').onclick=()=>page(index-1);$('next').onclick=()=>page(index+1);$('rail').onkeydown=e=>{if(e.target!==$('rail'))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();page(index+(e.key==='ArrowRight'?1:-1));}};$('rail').onscroll=()=>{const first=$('rail').children[0],step=first.getBoundingClientRect().width+14;index=Math.min(2,Math.max(0,Math.round($('rail').scrollLeft/step)));updatePosition();};
$('returnPlans').onclick=()=>{$('plans').hidden=false;$('current').hidden=true;$('stream').scrollTop=0;};$('openAlbum').onclick=$('quickAlbum').onclick=openAlbum;$('closeAlbum').onclick=()=>{$('album').hidden=true;$('draft').focus();};$('searchForm').onsubmit=e=>{e.preventDefault();renderAssets();};$('photoTab').onclick=()=>{kind='photo';$('photoTab').setAttribute('aria-pressed','true');$('videoTab').setAttribute('aria-pressed','false');renderAssets();};$('videoTab').onclick=()=>{kind='video';$('videoTab').setAttribute('aria-pressed','true');$('photoTab').setAttribute('aria-pressed','false');renderAssets();};
$('mode').onclick=()=>{$('modeMenu').hidden=!$('modeMenu').hidden;$('mode').setAttribute('aria-expanded',String(!$('modeMenu').hidden));};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>switchMode(b.dataset.mode));document.querySelectorAll('[data-quick]').forEach(b=>b.onclick=()=>{switchMode('chat');$('draft').value=b.dataset.quick;drafts.chat=b.dataset.quick;$('draft').focus();});$('draft').oninput=()=>drafts[mode]=$('draft').value;$('send').onclick=send;
$('upload').onclick=()=>{const a=document.createElement('section');a.className='panel';const p=document.createElement('p');p.textContent='正式版在此选择手机照片或视频；本线框可试放一个示例附件。';a.append(p,button('放入示例照片',()=>{choose(assets[0]);a.remove();status('示例附件已放入，尚未上传文件或发送。');}),button('放入示例视频',()=>{choose(assets[3]);a.remove();status('示例附件已放入，尚未上传文件或发送。');}),button('取消',()=>a.remove()));$('messages').append(a);bottom();};
$('voice').onclick=()=>{recording=!recording;$('voice').querySelector('span').textContent=recording?'停止':'对话中';$('voice').querySelector('use').setAttribute('href',recording?'#stop':'#mic');['send','mode','upload','openAlbum'].forEach(id=>$(id).disabled=recording);if(recording)status('模拟正在听，请点击停止。未访问麦克风。');else{$('draft').value+=($('draft').value?' ':'')+'今天女儿来看我了';drafts[mode]=$('draft').value;status('模拟语音已放入草稿，检查后再发送。');}};
$('manage').onclick=()=>{$('management').hidden=!$('management').hidden;$('manage').setAttribute('aria-expanded',String(!$('management').hidden));};$('reset').onclick=()=>location.reload();document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{if(b.dataset.view==='home'){$('plans').hidden=false;$('current').hidden=true;$('album').hidden=true;$('generation').hidden=true;$('stream').scrollTop=0;}else if(b.dataset.view==='chat')openPlan(0);else if(b.dataset.view==='album')openAlbum();else{switchMode('video');$('draft').value='把花园照片做成一段慢慢推进的视频';drafts.video=$('draft').value;generation={mode:'video',prompt:drafts.video,reference:[assets[0]],setting:'5 秒',step:'review'};renderGeneration();}});
mountPlans();updatePosition();
</script>
</body>
</html>
