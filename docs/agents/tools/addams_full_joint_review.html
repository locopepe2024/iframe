<!doctype html><html lang="zh"><meta charset="utf-8"><title>Addams 全片疑点关节标注</title>
<style>body{background:#17191e;color:#eee;font:16px system-ui;max-width:1200px;margin:20px auto;padding:0 16px}button,select,input{font:inherit;margin:4px;padding:7px}button:focus-visible,select:focus-visible,canvas:focus-visible{outline:3px solid #ffb45e}.panels{display:flex;gap:12px;flex-wrap:wrap}#canvas{width:100%;max-width:960px;touch-action:none}#zoom{width:300px;height:300px}#joints{display:flex;gap:5px;flex-wrap:wrap}.joint{border:1px solid #666;padding:4px}.selected{border:2px solid #ffb45e}.done{color:#5fe1bb}#notice{color:#ffd38b}p{line-height:1.6}</style>
<h1>全片疑点关节标注</h1><p>左右以人物自身为准。选择关节后点击定位，或用方向键微调（Shift 加速）。只标关节中心：衣服/身体外轮廓请选择“轮廓”，不作为骨骼位置使用。看不清可标“遮挡/不确定”，无需猜点。框号只对当前帧有效。已有人工点和事件已带入，其余点只是模型预测。</p>
<div><button id="prev">上一帧</button><select id="jump" aria-label="选择帧"></select><button id="next">下一帧</button><button id="pending">下一个未确认帧</button><span id="progress"></span></div>
<p id="meta"></p><div class="panels"><canvas id="canvas" width="960" height="520" tabindex="0" aria-label="关节点位编辑"></canvas><div><canvas id="zoom" width="360" height="360" aria-label="原图局部放大"></canvas><p>原分辨率 PNG 局部放大<br>鼠标移动查看；点击大图定位</p><a id="original" target="_blank" rel="noopener">打开原图</a></div></div>
<div id="joints"></div><div><label>可见性<select id="visibility"><option value="uncertain">不确定</option><option value="visible">可见</option><option value="occluded">遮挡</option></select></label><label>点位含义<select id="semantic"><option value="joint">关节中心</option><option value="body_contour">身体/衣服轮廓</option></select></label><button id="clear">清除选中点</button><button id="confirmJoint">确认选中关节并下一个</button><button id="hidden">确认其余点为不确定</button></div>
<div><label>主角<select id="identity"></select></label><label>接触<select id="contact"><option value="uncertain">不确定</option><option value="left">左脚支撑</option><option value="right">右脚支撑</option><option value="both">双脚支撑</option><option value="airborne">腾空</option><option value="other">手/身体触地</option></select></label><label>本帧<select id="status"><option value="reviewed">已复核</option><option value="not_evaluable">不可评</option></select></label><button id="save">确认本帧并下一帧</button><button id="download">下载 JSON</button><label>导入上次下载<input id="import" type="file" accept="application/json"></label></div>
<p id="notice" role="status"></p><p>建议先处理第49、52–56帧，再处理各镜头其余疑点。可分次完成；修改会撤销本帧确认。仅明确确认的帧会导出；导入上次 JSON 可继续。浏览器会尝试本地暂存，关闭前请下载。原图按帧从头解码保存为 PNG，未增加 JPEG 压缩；源视频已有模糊仍会保留。</p>
<script>
const pkg=/*PACKAGE*/{};
const $=id=>document.getElementById(id),names=pkg.joint_names,tasks=pkg.tasks,canvas=$('canvas'),ctx=canvas.getContext('2d'),zc=$('zoom').getContext('2d');
const cn={left:'左',right:'右',shoulder:'肩',elbow:'肘',wrist:'腕',hip:'髋',knee:'膝',ankle:'踝'},label=n=>n.split('_').map(v=>cn[v]).join('');
const reasonNames={mp_missing:'MP缺测',independent_missing:'独立模型缺测',multiple_proposals:'多人物候选',target_identity_review:'身份核对',model_disagreement_gt30_review_px:'模型分歧',kick_body_diagnostic:'踢腿/体态异常核对'};
let states=tasks.map(t=>({joints:structuredClone(t.points),identity:t.identity,contact:t.contact,status:'reviewed',saved:false})),index=Math.max(0,tasks.findIndex(t=>t.source_frame===49)),selected='left_shoulder',img=null,drag=false,loaded=false;
const key='addams-full-joints:'+pkg.tasks_sha256;
function message(v){$('notice').textContent=v;}
function persist(){try{localStorage.setItem(key,JSON.stringify(states));}catch{message('暂存不可用，请下载 JSON 保存进度。');}}
function validState(s,i){if(!s||!['reviewed','not_evaluable'].includes(s.status)||typeof s.saved!=='boolean'||!['uncertain','left','right','both','airborne','other'].includes(s.contact)||!['uncertain','absent','visible_undetected',...tasks[i].candidates.map(c=>String(c.id))].includes(s.identity)||!s.joints||Object.keys(s.joints).length!==names.length)return false;return names.every(n=>{const p=s.joints[n];return p&&typeof p.confirmed==='boolean'&&['visible','occluded','uncertain'].includes(p.visibility)&&['joint','body_contour'].includes(p.semantic)&&(p.xy_px===null||Array.isArray(p.xy_px)&&p.xy_px.length===2&&p.xy_px.every((v,k)=>Number.isFinite(v)&&v>=0&&v<=[960,520][k]));});}
try{const old=JSON.parse(localStorage.getItem(key));if(Array.isArray(old)&&old.length===tasks.length&&old.every(validState))states=old;}catch{}
function progress(){$('progress').textContent=`帧 ${index+1}/${tasks.length} · 已确认 ${states.filter(s=>s.saved).length} · 本帧关节 ${names.filter(n=>states[index].joints[n].confirmed).length}/${names.length}`;}
function magnify(x,y){zc.fillStyle='#111';zc.fillRect(0,0,360,360);if(!loaded)return;const sx=x*img.naturalWidth/960,sy=y*img.naturalHeight/520;zc.drawImage(img,sx-90,sy-90,180,180,0,0,360,360);zc.strokeStyle='#ffb45e';zc.beginPath();zc.moveTo(170,180);zc.lineTo(190,180);zc.moveTo(180,170);zc.lineTo(180,190);zc.stroke();}
function draw(){ctx.clearRect(0,0,960,520);if(loaded)ctx.drawImage(img,0,0,960,520);for(const c of tasks[index].candidates){ctx.strokeStyle=states[index].identity===String(c.id)?'#ffb45e':'#666';const [x,y,r,b]=c.box;ctx.strokeRect(x*960,y*520,(r-x)*960,(b-y)*520);ctx.font='15px sans-serif';ctx.fillStyle='white';ctx.fillText('候选'+c.id,x*960+4,Math.max(16,y*520));}for(const n of names){const p=states[index].joints[n];if(!p.xy_px)continue;const [x,y]=p.xy_px;ctx.strokeStyle=n===selected?'#ffb45e':p.confirmed?'#5fe1bb':'#aaa';ctx.lineWidth=n===selected?3:2;ctx.beginPath();ctx.arc(x,y,n===selected?8:4,0,Math.PI*2);ctx.stroke();ctx.font='13px sans-serif';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(label(n),x+9,y);ctx.fillStyle='white';ctx.fillText(label(n),x+9,y);}}
function controls(){$('joints').replaceChildren();for(const n of names){const b=document.createElement('button');b.className='joint'+(selected===n?' selected':'')+(states[index].joints[n].confirmed?' done':'');b.textContent=label(n)+(states[index].joints[n].confirmed?' ✓':'');b.onclick=()=>{selected=n;controls();draw();};$('joints').append(b);}const p=states[index].joints[selected];$('visibility').value=p.visibility;$('semantic').value=p.semantic;progress();}
function dirty(point=true){states[index].saved=false;if(point)states[index].joints[selected].confirmed=false;persist();progress();}
function load(){loaded=false;drag=false;const t=tasks[index],s=states[index];$('jump').value=index;$('meta').textContent=`源第 ${t.source_frame} 帧 · ${t.pts_s.toFixed(2)}s · ${t.segment_id} · `+t.reasons.map(v=>reasonNames[v]||v).join('、')+(t.event_previously_reviewed?' · 已带入人工身份/接触':'');$('original').href=t.image;$('identity').replaceChildren();for(const [v,l]of [['uncertain','不确定'],...t.candidates.map(c=>[String(c.id),'候选 '+c.id]),['visible_undetected','主角可见但未检出'],['absent','主角不在画内']]){const o=document.createElement('option');o.value=v;o.textContent=l;$('identity').append(o);}for(const id of ['identity','contact','status'])$(id).value=s[id];controls();draw();const fresh=new Image();img=fresh;fresh.onload=()=>{if(img!==fresh)return;loaded=true;draw();const p=s.joints[selected].xy_px||[480,260];magnify(...p);};fresh.onerror=()=>{if(img===fresh)message('无法读取原图，请将 review.html 与 images 文件夹保存在同一目录。');};fresh.src=t.image;message(s.saved?'本帧已确认。':'本帧待审，模型预测尚未确认。');}
for(const [i,t]of tasks.entries()){const op=document.createElement('option');op.value=i;op.textContent=`F${t.source_frame} · ${t.segment_id}`;$('jump').append(op);}
function position(e){const r=canvas.getBoundingClientRect();return [Math.max(0,Math.min(960,(e.clientX-r.left)/r.width*960)),Math.max(0,Math.min(520,(e.clientY-r.top)/r.height*520))];}
function move(e){if(!loaded)return;const xy=position(e);magnify(...xy);if(drag){states[index].joints[selected].xy_px=xy;dirty();draw();}}
canvas.onpointerdown=e=>{if(!loaded)return;drag=true;canvas.setPointerCapture(e.pointerId);move(e);};canvas.onpointermove=move;canvas.onpointerup=canvas.onpointercancel=()=>{drag=false;};canvas.onkeydown=e=>{if(!loaded||!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const p=states[index].joints[selected];if(!p.xy_px)return;const step=e.shiftKey?5:1;p.xy_px=[Math.max(0,Math.min(960,p.xy_px[0]+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0))),Math.max(0,Math.min(520,p.xy_px[1]+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0)))];dirty();draw();magnify(...p.xy_px);};
for(const id of ['visibility','semantic'])$(id).onchange=()=>{states[index].joints[selected][id]=$(id).value;dirty();controls();draw();};for(const id of ['identity','contact','status'])$(id).onchange=()=>{states[index][id]=$(id).value;dirty(false);draw();};
$('clear').onclick=()=>{states[index].joints[selected].xy_px=null;states[index].joints[selected].visibility='uncertain';dirty();controls();draw();};
$('confirmJoint').onclick=()=>{const p=states[index].joints[selected];if(p.visibility==='visible'&&!p.xy_px){message('可见关节请先定位。');return;}p.confirmed=true;dirty(false);selected=names.find(n=>!states[index].joints[n].confirmed)||selected;controls();draw();};
$('hidden').onclick=()=>{for(const n of names){const p=states[index].joints[n];if(!p.confirmed){p.visibility='uncertain';p.xy_px=null;p.confirmed=true;}}dirty(false);controls();draw();message('其余未确认点已明确标为不确定，不作为可见关节点使用。');};
function error(s){if(names.some(n=>!s.joints[n].confirmed))return '请确认每个关节；看不清的点可标不确定。';if(names.some(n=>s.joints[n].visibility==='visible'&&!s.joints[n].xy_px))return '可见关节需要点位。';if(s.identity==='absent'&&(s.contact!=='uncertain'||s.status!=='not_evaluable'))return '主角出画时请选择不可评、接触不确定。';return '';}
$('save').onclick=()=>{const s=states[index],err=error(s);if(err){message(err);return;}s.saved=true;persist();if(index<tasks.length-1)index++;load();};$('prev').onclick=()=>{index=Math.max(0,index-1);load();};$('next').onclick=()=>{index=Math.min(tasks.length-1,index+1);load();};$('jump').onchange=()=>{index=Number($('jump').value);load();};$('pending').onclick=()=>{for(let j=1;j<=tasks.length;j++){const k=(index+j)%tasks.length;if(!states[k].saved){index=k;load();return;}}message('全部帧已确认，请下载。');};
$('download').onclick=()=>{const frames=tasks.flatMap((t,i)=>states[i].saved?[{source_frame:t.source_frame,image_sha256:t.image_sha256,joints:states[i].joints,identity:states[i].identity,contact:states[i].contact,status:states[i].status}]:[]);const data={schema:'addams-full-joint-review.v1',tasks_sha256:pkg.tasks_sha256,source_sha256:pkg.source_sha256,frames};const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='addams-full-joint-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message(`已下载 ${frames.length}/${tasks.length} 帧；可导入继续。`);};
$('import').onchange=async e=>{try{const file=e.target.files[0];if(!file)return;const d=JSON.parse(await file.text());if(d.schema!=='addams-full-joint-review.v1'||d.tasks_sha256!==pkg.tasks_sha256||d.source_sha256!==pkg.source_sha256)throw Error('文件不是本版本任务');const staged=structuredClone(states),seen=new Set();for(const f of d.frames){const i=tasks.findIndex(t=>t.source_frame===f.source_frame);if(i<0||seen.has(i)||f.image_sha256!==tasks[i].image_sha256)throw Error('帧号或图片不匹配');seen.add(i);const s={joints:f.joints,identity:f.identity,contact:f.contact,status:f.status,saved:true};if(!validState(s,i)||error(s))throw Error('标注内容无效');staged[i]=s;}states=staged;persist();load();message('导入完成，可继续标注。');}catch(err){message('导入失败：'+err.message);}finally{e.target.value='';}};
load();
</script></html>
