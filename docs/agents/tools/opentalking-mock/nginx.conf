server {
    listen 3444 ssl;
    listen [::]:3444 ssl;
    server_name garage.uniart.fun;
    ssl_certificate /etc/letsencrypt/live/garage.uniart.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garage.uniart.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 10m;
    root /srv/lumenx/opentalking-mock/web;

    # Demo permits session actions; channel/admin/asset writes stay host-local.
    location ~ ^/api/(sessions(?:/[^/]+(?:/(?:start|speak|interrupt|events|webrtc/offer))?)?|webrtc/ice-config)$ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://127.0.0.1:18083;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
    location /api/ {
        limit_except GET { deny all; }
        proxy_pass http://127.0.0.1:18083/;
        proxy_set_header Host $host;
        proxy_buffering off;
    }
    location / { try_files $uri $uri/ /index.html; }
}
