<!doctype html><html lang="zh"><meta charset="utf-8"><title>Addams 全片事件复核</title>
<style>body{background:#17191e;color:#eee;font:16px system-ui;max-width:1040px;margin:24px auto;padding:0 16px}button,select{font:inherit;padding:8px;margin:4px}canvas{width:100%;max-width:960px}button:focus-visible,select:focus-visible{outline:3px solid #ffb45e}#notice{color:#ffd38b}p{line-height:1.6}</style>
<h1>全片事件复核</h1><p>只确认当前代表帧的人物和接触状态。框号属于该帧，不跨帧继承。选择主角所在的框；主角可见但没有框时选择“可见但未检出”。腾空、手/身体触地与脚支撑分别标注。未确认项保持待审。</p>
<div><button id="prev">上一项</button><select id="jump" aria-label="跳转代表帧"></select><button id="next">下一项</button><span id="progress"></span></div>
<p id="meta"></p><canvas id="canvas" width="960" height="520" aria-label="当前源帧与候选人物编号"></canvas>
<div><label>主角 <select id="identity"></select></label><label>接触 <select id="contact"><option value="uncertain">不确定</option><option value="left">左脚支撑</option><option value="right">右脚支撑</option><option value="both">双脚支撑</option><option value="airborne">腾空</option><option value="other">手或身体触地</option></select></label><button id="save">确认并下一项</button><button id="revoke">撤销本项确认</button><button id="download">下载 JSON</button></div>
<p id="notice" role="status"></p><p>本页不上传数据。修改会撤销本项确认。浏览器会尝试本地暂存，关闭前请下载。模型结果不是人工标注；代表帧的确认不会自动覆盖整个动作区间。</p>
<script>
const pkg=/*PACKAGE*/{};
const tasks=pkg.tasks,canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d'),$=id=>document.getElementById(id);
const key='addams-event-review:'+pkg.tasks_sha256;let index=0,img=null;
let states=tasks.map(()=>({identity:'uncertain',contact:'uncertain',saved:false}));
try{const old=JSON.parse(localStorage.getItem(key));if(Array.isArray(old)&&old.length===states.length&&old.every((s,i)=>s&&typeof s.saved==='boolean'&&['uncertain','absent','visible_undetected',...tasks[i].candidates.map(c=>String(c.id))].includes(s.identity)&&['uncertain','left','right','both','airborne','other'].includes(s.contact)))states=old;}catch{}
function message(text){$('notice').textContent=text;}
function persist(){try{localStorage.setItem(key,JSON.stringify(states));return true;}catch{message('无法本地暂存，请下载 JSON 保存。');return false;}}
const reasonNames={mp_missing:'MP未检出',independent_missing:'独立模型未检出',multiple_proposals:'多个人物候选',target_identity_review:'人物身份待核对',model_disagreement_gt30_review_px:'两模型点位分歧'};
for(const [i,t]of tasks.entries()){const o=document.createElement('option');o.value=i;o.textContent=`F${t.source_frame} · ${t.segment_id}`;$('jump').append(o);}
function draw(){ctx.clearRect(0,0,960,520);if(img?.complete&&img.naturalWidth)ctx.drawImage(img,0,0,960,520);for(const c of tasks[index].candidates){const [x,y,r,b]=c.box;const active=states[index].identity===String(c.id);ctx.strokeStyle=active?'#ffb45e':'#2dd4bf';ctx.lineWidth=active?4:2;ctx.strokeRect(x*960,y*520,(r-x)*960,(b-y)*520);const text='候选 '+c.id;ctx.font='18px sans-serif';ctx.fillStyle='#111';ctx.fillRect(x*960,Math.max(0,y*520-25),90,25);ctx.fillStyle=active?'#ffb45e':'#2dd4bf';ctx.fillText(text,x*960+3,Math.max(19,y*520-5));}}
function load(){const t=tasks[index],s=states[index];$('jump').value=index;$('meta').textContent=`源第 ${t.source_frame} 帧 · ${t.pts_s.toFixed(2)} 秒 · `+t.intervals.map(v=>`${reasonNames[v.reason]||v.reason}（F${v.first_frame}–${v.last_frame}）`).join('；');$('identity').replaceChildren();for(const [v,label]of [['uncertain','不确定'],...t.candidates.map(c=>[String(c.id),'候选 '+c.id]),['visible_undetected','可见但未检出'],['absent','主角不在画内']]){const o=document.createElement('option');o.value=v;o.textContent=label;$('identity').append(o);}$('identity').value=s.identity;$('contact').value=s.contact;$('progress').textContent=`已确认 ${states.filter(v=>v.saved).length}/${tasks.length}`;$('prev').disabled=index===0;$('next').disabled=index===tasks.length-1;message(s.saved?'本项已确认。':'本项待审。');const current=new Image();img=current;current.onload=()=>{if(img===current)draw();};current.src=t.preview;draw();}
for(const id of ['identity','contact'])$(id).onchange=()=>{states[index][id]=$(id).value;states[index].saved=false;persist();draw();message('已修改，请重新确认。');};
$('prev').onclick=()=>{index=Math.max(0,index-1);load();};$('next').onclick=()=>{index=Math.min(tasks.length-1,index+1);load();};$('jump').onchange=()=>{index=Number($('jump').value);load();};
$('save').onclick=()=>{const s=states[index];if(s.identity==='absent'&&s.contact!=='uncertain'){message('主角不在画内时，接触应为不确定。');return;}s.saved=true;const stored=persist();if(index<tasks.length-1){index++;load();}else{load();message('已到最后一项，请下载 JSON。');}if(!stored)message('无法本地暂存，请下载 JSON 保存。');};
$('revoke').onclick=()=>{states[index].saved=false;persist();load();};
$('download').onclick=()=>{const reviews=tasks.flatMap((t,i)=>states[i].saved?[{source_frame:t.source_frame,image_sha256:t.image_sha256,identity:states[i].identity,contact:states[i].contact}]:[]);const out={schema:'addams-event-review.v1',source_sha256:pkg.source_sha256,queue_sha256:pkg.queue_sha256,tasks_sha256:pkg.tasks_sha256,reviews};const url=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='addams-event-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);message(`已下载 ${reviews.length} 项人工确认；其余仍待审。`);};
load();
</script></html>
