<!doctype html><html lang="zh"><meta charset="utf-8"><title>Addams 五帧关节审阅</title>
<style>body{background:#17191e;color:#eee;font:16px system-ui;max-width:1100px;margin:24px auto;padding:0 16px}button,select{font:inherit;padding:8px;margin:4px}canvas{width:100%;max-width:960px;touch-action:none;border:1px solid #777}#joints{display:flex;flex-wrap:wrap;gap:8px}.joint{padding:8px;border:1px solid #888}.selected{border:2px solid #5fe1bb}button:focus-visible,select:focus-visible{outline:3px solid #ffb45e}#notice{color:#ffd38b}</style>
<h1>五帧膝踝审阅</h1><p>选择关节后，在图上点击或拖动定位。左右按人物自身定义。可用键盘方向键微调（Shift 加速）。隐藏点保留位置，标记“遮挡”或“不确定”。点位默认是模型预测，尚未经人工确认。</p>
<div><button id="prev">上一帧</button><span id="frame"></span><button id="next">下一帧</button></div>
<canvas id="canvas" width="960" height="520" tabindex="0" aria-label="关节点位编辑，选中关节后用方向键调整"></canvas><div id="joints"></div>
<div><label>接触状态 <select id="contact"><option value="uncertain">不确定</option><option value="left">左脚支撑</option><option value="right">右脚支撑</option><option value="both">双脚支撑</option><option value="airborne">腾空</option></select></label><label>本帧 <select id="status"><option value="reviewed">已复核</option><option value="not_evaluable">不可评</option></select></label><button id="save">确认本帧</button><button id="download">下载标注 JSON</button></div><p id="notice" role="status"></p><p>未确认帧不会导出为人工标注。本页不上传数据；关闭前请下载。下载后可通过导入命令触发校验。</p>
<script>
const tasks=/*TASK_DATA*/[];
const labels={left_hip:'左髋',right_hip:'右髋',left_knee:'左膝',right_knee:'右膝',left_ankle:'左踝',right_ankle:'右踝'};
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');let index=0,selected='left_knee',image=new Image(),drag=false;
const states=tasks.map(t=>({points:Object.fromEntries(t.predictions[0].result.map(r=>[r.value.keypointlabels[0],{x:r.value.x,y:r.value.y,visibility:'uncertain'}])),contact:'uncertain',status:'reviewed',saved:false}));
function notice(s){document.getElementById('notice').textContent=s;}
function draw(){ctx.clearRect(0,0,960,520);if(image.complete&&image.naturalWidth)ctx.drawImage(image,0,0,960,520);for(const [n,p]of Object.entries(states[index].points)){let x=p.x*9.6,y=p.y*5.2;ctx.beginPath();ctx.arc(x,y,n===selected?8:5,0,Math.PI*2);ctx.strokeStyle=n===selected?'#ffb45e':'#5fe1bb';ctx.lineWidth=3;ctx.stroke();ctx.font='14px sans-serif';ctx.fillStyle='#fff';ctx.strokeStyle='#000';ctx.lineWidth=3;ctx.strokeText(labels[n],x+10,y);ctx.fillText(labels[n],x+10,y);}}
function controls(){const el=document.getElementById('joints');el.replaceChildren();for(const n of Object.keys(labels)){const box=document.createElement('div');box.className='joint'+(n===selected?' selected':'');const b=document.createElement('button');b.textContent=labels[n];b.onclick=()=>{selected=n;controls();draw();};const s=document.createElement('select');s.setAttribute('aria-label',labels[n]+'可见性');for(const [v,l]of [['uncertain','不确定'],['visible','可见'],['occluded','遮挡']]){const o=document.createElement('option');o.value=v;o.textContent=l;s.append(o);}s.value=states[index].points[n].visibility;s.onchange=()=>{states[index].points[n].visibility=s.value;dirty();};box.append(b,s);el.append(box);}}
function dirty(){states[index].saved=false;notice('本帧已修改，请重新确认。');}
function load(){document.getElementById('frame').textContent=`源第 ${tasks[index].data.source_frame} 帧 · ${tasks[index].data.source_pts_s}s`;document.getElementById('contact').value=states[index].contact;document.getElementById('status').value=states[index].status;const img=new Image();image=img;img.onload=()=>{if(image===img)draw();};img.src=tasks[index].preview;controls();notice(states[index].saved?'本帧已确认。':'本帧尚未确认。');}
function move(e){const r=canvas.getBoundingClientRect(),p=states[index].points[selected];p.x=Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100));p.y=Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100));dirty();draw();}
canvas.onpointerdown=e=>{drag=true;canvas.setPointerCapture(e.pointerId);move(e);};canvas.onpointermove=e=>{if(drag)move(e);};canvas.onpointerup=()=>{drag=false;};canvas.onpointercancel=()=>{drag=false;};canvas.onkeydown=e=>{if(!['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();const p=states[index].points[selected],step=e.shiftKey?5:1;p.x=Math.max(0,Math.min(100,p.x+(e.key==='ArrowRight'?step:e.key==='ArrowLeft'?-step:0)/9.6));p.y=Math.max(0,Math.min(100,p.y+(e.key==='ArrowDown'?step:e.key==='ArrowUp'?-step:0)/5.2));dirty();draw();};
document.getElementById('prev').onclick=()=>{index=Math.max(0,index-1);load();};document.getElementById('next').onclick=()=>{index=Math.min(tasks.length-1,index+1);load();};for(const id of ['contact','status'])document.getElementById(id).onchange=e=>{states[index][id]=e.target.value;dirty();};document.getElementById('save').onclick=()=>{states[index].saved=true;notice('已确认本帧；请检查下一帧并下载标注。');};
document.getElementById('download').onclick=()=>{const output=tasks.map((t,i)=>{const a={data:t.data,annotations:[]},s=states[i];if(!s.saved)return a;const result=[];for(const [name,p]of Object.entries(s.points)){result.push({id:name,from_name:'joints',to_name:'image',type:'keypointlabels',original_width:960,original_height:520,image_rotation:0,value:{x:p.x,y:p.y,width:.6,keypointlabels:[name]}});result.push({id:name,from_name:'visibility',to_name:'image',type:'choices',value:{choices:[p.visibility]}});}for(const n of ['contact','frame_status'])result.push({from_name:n,to_name:'image',type:'choices',value:{choices:[n==='contact'?s.contact:s.status]}});a.annotations=[{result}];return a;});const url=URL.createObjectURL(new Blob([JSON.stringify(output,null,2)],{type:'application/json'}));const a=document.createElement('a');a.href=url;a.download='addams-human-review.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);notice(`已下载，确认帧 ${states.filter(s=>s.saved).length}/5。`);};
load();
</script></html>
