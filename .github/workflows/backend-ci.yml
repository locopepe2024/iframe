# Minimal mechanical validation gate for merging into main.
#
# Runs the Python test suite and the model catalog validation script on
# every pull request targeting main (and on pushes to main as a post-merge
# safety net). Local development flow is unchanged — this only enforces
# the checks that CLAUDE.md already declares.
#
# To make this a hard gate, enable branch protection on main with
# "backend-tests" as a required status check.

name: Backend CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install dependencies
        # requirements-docker.txt is the headless subset of requirements.txt
        # (no pywebview / demucs); the test suite only needs these.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt pytest

      - name: Run Python test suite
        run: python -m pytest --ignore=tests/test_recreation.py --ignore=tests/test_reference_files.py

      - name: Validate model catalog
        run: python scripts/validate_model_catalog.py

  recreation-media-tests:
    # The full module must run where BOTH fixture and application FFmpeg calls
    # execute. Never run fork PR code on the media host.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, linux, x64, iframe-media-ffmpeg]
    timeout-minutes: 20
    concurrency:
      group: iframe-recreation-media
      cancel-in-progress: false
    steps:
      - name: Checkout exact tested revision
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Verify media FFmpeg runtime
        run: |
          test "$(id -un)" = iframe-ci
          test "$(command -v ffmpeg)" = /usr/bin/ffmpeg
          test "$(command -v ffprobe)" = /usr/bin/ffprobe
          hostname
          ffmpeg -version
          ffprobe -version

      - name: Create isolated Python environment
        run: |
          python3 -m venv "$RUNNER_TEMP/recreation-venv"
          "$RUNNER_TEMP/recreation-venv/bin/python" -m pip install -r requirements-docker.txt pytest

      - name: Run FFmpeg tests on media
        run: |
          "$RUNNER_TEMP/recreation-venv/bin/python" -m pytest -q tests/test_recreation.py tests/test_reference_files.py --junitxml="$RUNNER_TEMP/recreation-results.xml"

      - name: Verify Blender depth on media
        env:
          IFRAME_TEST_BLENDER_BIN: /opt/blender/blender
        run: |
          /opt/blender/blender --background --factory-startup --threads 1 --python-exit-code 1 --python scripts/director3d/check_depth_reference.py
          "$RUNNER_TEMP/recreation-venv/bin/python" -m pytest -q tests/test_director_depth.py

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recreation-media-results
          path: ${{ runner.temp }}/recreation-results.xml
          if-no-files-found: ignore

  frontend-playground-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify playground ratio contract and tests
        working-directory: frontend
        run: npm run verify:playground

      - name: Build frontend export
        working-directory: frontend
        env:
          DOCKER_BUILD: "true"
        run: npm run build
