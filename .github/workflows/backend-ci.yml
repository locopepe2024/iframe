# Minimal mechanical validation gate for merging into main.
#
# Python tests that need real ffmpeg run on the isolated media runner after
# trusted main pushes. All other tests remain a pull-request gate.
#
# To make this a hard gate, enable branch protection on main with
# "backend-tests" as a required status check.

name: Backend CI

permissions:
  contents: read

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-docker.txt

      - name: Install dependencies
        # requirements-docker.txt is the headless subset of requirements.txt
        # (no pywebview / demucs); the test suite only needs these.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-docker.txt pytest

      - name: Run Python test suite
        run: python -m pytest -m "not media_ffmpeg"

      - name: Validate model catalog
        run: python scripts/validate_model_catalog.py

  media-ffmpeg-tests:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: [self-hosted, linux, x64, iframe-media-ffmpeg]
    timeout-minutes: 20
    steps:
      - name: Checkout trusted main revision
        uses: actions/checkout@v4

      - name: Verify media host tools
        run: |
          command -v ffmpeg
          command -v ffprobe
          ffmpeg -version | head -n 1
          python3 --version

      - name: Install isolated test dependencies
        run: |
          python3 -m venv .venv-ci
          .venv-ci/bin/python -m pip install -r requirements-docker.txt pytest

      - name: Run real media tests
        env:
          LUMENX_RECREATION_SAMPLE: ""
        run: .venv-ci/bin/python -m pytest -m media_ffmpeg

  frontend-playground-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Verify playground ratio contract and tests
        working-directory: frontend
        run: npm run verify:playground

      - name: Build frontend export
        working-directory: frontend
        env:
          DOCKER_BUILD: "true"
        run: npm run build
