# Production upgrades use scripts/deploy_server_release.py.
# This topology shares the sole production config source; no repository .env.
version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: iframe-backend
    env_file:
      - /srv/lumenx/runtime/iframe-backend.env
    volumes:
      - /srv/lumenx/output:/app/output
    ports:
      - "17177:17177"
    restart: unless-stopped
    networks:
      - default
      - lumenx-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: iframe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  lumenx-net:
    external: true
