version: "3.8"

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: iframe-backend
    env_file:
      - .env
    environment:
      - NO_PROXY=*.aliyuncs.com,localhost,127.0.0.1
    volumes:
      - /srv/lumenx/output:/app/output
    ports:
      - "17177:17177"
    restart: unless-stopped
    networks:
      - default
      - lumenx-net

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: iframe-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

networks:
  lumenx-net:
    external: true
