server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Next.js production output has a /static base path while the build files
    # are mounted at the document root.
    location ^~ /static/ {
        alias /usr/share/nginx/html/;
    }

    # Frontend routes (SPA fallback)
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # Proxy same-origin API requests to backend. Keep this list aligned with
    # FastAPI's top-level route families so SPA navigation still falls through
    # to index.html while authenticated API and signed-media paths are proxied.
    location ~ ^/(api/|auth(?:/|$)|agent(?:/|$)|user(?:/|$)|series(?:/|$)|library(?:/|$)|asset-index(?:/|$)|playground(?:/|$)|studio(?:/|$)|bgm(?:/|$)|voices(?:/|$)|prompt_defaults(?:/|$)|health$|system(?:/|$)|debug(?:/|$)|diagnose(?:/|$)|tasks(?:/|$)|voice(?:/|$)|video(?:/|$)) {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 100M;
    }

    # Source videos are limited to 256 MiB by the API; allow multipart overhead.
    location /recreation/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_read_timeout 3600s;
        client_max_body_size 257M;
    }

    location /projects {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_http_version 1.1;
        client_max_body_size 100M;
    }

    location /files/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /tasks/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /art_direction/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /upload {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
        client_max_body_size 100M;
    }

    location /video/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /voices {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /config/ {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /docs {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }

    location /openapi.json {
        proxy_pass http://backend:17177;
        proxy_set_header Host $host;
    }
}
